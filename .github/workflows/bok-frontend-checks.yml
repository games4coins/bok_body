name: BOK frontend checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: |
          set -euo pipefail
          find assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check config.js
          node tests/vk-session.test.js
          node tests/boutique-grid.test.js
          node tests/public-boutique-grid.test.js
          node tests/grid-quality.test.js
          node tests/responsive-booking-grid.test.js
          node tests/archive-achievements-backlog.test.js
          node tests/loading-resilience.test.js
          node tests/deposit-receipt.test.js
      - name: Check release and routing invariants
        run: |
          set -euo pipefail
          grep -Fq '6.7.24' index.html
          grep -Fq '6.7.24' admin.html
          grep -Fq 'История версий и изменений' index.html
          grep -Fq 'История версий и изменений' admin.html
          grep -Fq 'rewardAction:rewardAction.value' assets/admin.js
          grep -Fq 'Object.assign({},safePayload,{action})' assets/common.js
          grep -Fq 'function ensureToken()' assets/vk-auth.js
          grep -Fq 'adminDepositConfirm' assets/admin.js
          grep -Fq 'adminUnlockBackfill' assets/admin.js
          grep -Fq 'bok-admin-action-buttons' assets/admin.js
          grep -Fq 'bok-admin-statuses' assets/admin.js
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' assets/styles.css
          grep -Fq 'bok-admin-grid-page .bok-admin-actionbar' assets/styles.css
          grep -Fq '6.7.29' admin.html
          grep -Fq '6.7.33' index.html
          grep -Fq '6.7.34' admin.html
          grep -Fq '6.7.37' index.html
          grep -Fq '6.7.37' admin.html
          grep -Fq '6.7.35' admin.html
          grep -Fq 'achApply' assets/admin.js
          grep -Fq 'bookingGridStyle' assets/app.js
          grep -Fq 'bookingGridStyle' assets/admin.js
          grep -Fq "f:'Своб.',p:'Ждёт',a:'Опл.',t:'Подтв.',b:'Блок'" assets/app.js
          grep -Fq 'BOK 6.7.31' assets/styles.css
          grep -Fq 'gridQuality' assets/app.js
          grep -Fq 'gridQuality' assets/admin.js
          grep -Fq 'bok-grid-lite' assets/styles.css
          grep -Fq 'bok-public-grid' assets/app.js
          grep -Fq 'bok_grid_mode_v1' assets/common.js
          grep -Fq 'bok-boutique-grid' assets/styles.css
          grep -Fq 'GRID_FACE_MS = 6000' assets/admin.js
          grep -Fq 'function systemDiagnosticsView()' assets/admin.js
          grep -Fq "version: () => call('GET', 'version'" assets/common.js
          echo 'Frontend invariants OK'
